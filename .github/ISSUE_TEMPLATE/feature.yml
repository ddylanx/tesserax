name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: core-loop
    attributes:
      label: Which part of the core loop does it touch?
      options:
        - Ticket intake (tasks, Jira)
        - Analyze and spec
        - Human gates
        - Implement (agents)
        - Tests, lint and AI review
        - Score and metrics
        - Workflow editor and skills
        - Other
    validations:
      required: true

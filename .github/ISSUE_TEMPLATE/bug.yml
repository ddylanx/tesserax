name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: OS, Node and pnpm versions
      placeholder: macOS 15, Node 22.12, pnpm 10.33
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact tokens, emails and other secrets before pasting.
      render: shell
